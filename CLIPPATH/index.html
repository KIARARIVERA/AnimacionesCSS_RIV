<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIPPATH SEMANA 6</title>
    <style>
        *{
            padding: 0px;
            margin: 0 auto;
        }
        .marco1{
            background-image: url(img/corey.jpg);
            background-size: cover;
            height: 200px;
            width: 200px;
            clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);


            /* clip-path: circle(50%); */
        }
        .contenedor{
            background-image: url(img/fiesta.avif);
            background-size: cover;
            width: 800px;
            height: 700px;
            position: relative;
            border: 1px solid;
            margin: 0 auto;
            overflow: hidden;
            z-index: -1;
        }
        .forma1{
            background-image: url(img/gorro.jpg);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            background-size: cover;
            height: 180px;
            width: 200px;
            position: absolute;
            top: -180px;
            left: 300px;
            z-index: -1;

            animation: gorro 2s 1 forwards 4s;
        }
        @keyframes gorro{
            0%{
                top: -180px;
                transform: rotate(180deg);
            }
            100%{
                top: 0px;
            }

        }
        .forma2{
            background-image: url(img/carar.png);
            background-size: cover;
            clip-path: circle(50%);
            height: 200px;
            width: 200px;
            position: absolute;
            left: -320px;
            top: 150px;
            z-index: -2;

            animation: cara 3s 1 forwards 2s linear;
        }
        @keyframes cara {
            0%{
                left: -320px;
                top: 130px;
            }
            25%{
                left: -160px;
                top: 150px;
            }
            50%{
                left: 0px;
                top: 130px;
            }
            75%{
                left: 150px;
                top: 150px;
            }
            100%{
                left: 300px;
                top: 150px;
            }
        }
        .forma3{
            background-image: url(img/cam.jpg);
            clip-path: polygon(25% 0%, 75% 0, 100% 100%, 0% 100%);
            background-size: cover;
            height: 250px;
            width: 180px;
            position: absolute;
            left: -310px;
            top: 330px;
            z-index: -1;
            
            animation: cam1 3s 1 forwards 2s linear;
        }
        @keyframes cam1 {
            0%{
                left: -310px;
                top: 310px;
            }
            25%{
                left: -155px;
                top: 330px;
            }
            50%{
                left: 0px;
                top: 330px;
            }
            75%{
                left: 155px;
                top: 310px;
            }
            100%{
                left: 310px;
                top: 330px;
            }
        }
        .forma4{
            background-image: url(img/camis.jpg);
            clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
            background-size: cover;
            height: 60px;
            width: 450px;
            position: absolute;
            left: -430px;
            top: 400px;
            z-index: -2;

            animation: cam2 3s 1 forwards 2s linear;
        }
        @keyframes cam2 {
            0%{
                left: -430px;
                top: 400px;
                rotate: 10deg;
            }
            20%{
                left: -286px;
                top: 400px;
                rotate: 0deg;
            }
            40%{
                left: -143px;
                top: 400px;
                rotate: 10deg;
            }
            60%{
                left: 0px;
                top: 400px;
                rotate: 0deg;
            }
            80%{
                left: 85px;
                top: 400px;
                rotate: 10deg;
            }
            100%{
                left: 170px;
                top: 400px;
                rotate: 0deg;
            }
            
        }
        .forma5{
            background-image: url(img/geans.jpg);
            clip-path: ellipse(50% 29% at 50% 50%);
            background-size: cover;
            height: 200px;
            width: 200px;
            position: absolute;
            left: -400px;
            top: 530px;
            z-index: -1;

            animation: pierna 3s 1 forwards 2s linear;
        }
        @keyframes pierna {
            0%{
                left: -400px;
                top: 530px;
            }
            16%{
                left: -300px;
                top: 510px;
            }
            32%{
                left: -200px;
                top: 530px;
            }
            48%{
                left: -100px;
                top: 510px;
            }
            64%{
                left: 0px;
                top: 530px;
            }
            80%{
                left: 100px;
                top: 510px;
            }
            100%{
                left: 200px;
                top: 530px;
            }
        }
        .forma6{
            background-image: url(img/geans.jpg);
            clip-path: ellipse(50% 29% at 50% 50%);
            background-size: cover;
            height: 200px;
            width: 200px;
            position: absolute;
            left: -200px;
            top: 530px;
            z-index: -1;

            animation: pierna1 3s 1 forwards 2s linear;
        }
        @keyframes pierna1 {
            0%{
                left: -200px;
                top: 510px;
            }
            16%{
                left: -100px;
                top: 530px;
            }
            32%{
                left: 0px;
                top: 510px;
            }
            48%{
                left: 100px;
                top: 530px;
            }
            64%{
                left: 200px;
                top: 510px;
            }
            80%{
                left: 300px;
                top: 530px;
            }
            100%{
                left: 400px;
                top: 530px;
            }
            
        }
        .cont{
            width: 180px;
            height: 250px;
            position: relative;
            left: 240px;
            top: -250px;
            z-index: 0;

            animation: cono 2s 1 forwards 4s linear;
        }
        @keyframes cono {
            0%{
                top: -250px;
            }
            100%{
                top: 230px;
            }
        }
        .forma7{
            background-image: url(img/helado.webp);
            background-size: cover;
            position: absolute;
            width: 100px;
            height: 100px;
            clip-path: circle(50%);
            top: 50px;
            left: 0px;
            z-index: -1;
        }
        .forma8{
            background-image: url(img/helado\ fresa.jpg);
            background-size: cover;
            position: absolute;
            width: 100px;
            height: 100px;
            clip-path: circle(50%);
            top: 0px;
            left: 40px;
            z-index: -1;
        }
        .forma9{
            background-image: url(img/helado.webp);
            background-size: cover;
            position: absolute;
            width: 100px;
            height: 100px;
            clip-path: circle(50%);
            top: 50px;
            left: 80px;
            z-index: -1;
        }
        .forma10{
            background-image: url(img/cono.jpg);
            background-size: cover;
            position: absolute;
            width: 130px;
            height: 120px;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            top: 130px;
            left: 25px;
            z-index: -2;
        }
    </style>
</head>
<body>
    <a href="../index.html">VOLVER AL INICIO</a>
    <div class="marco1"></div>
    <br>
    <hr>
    <div class="contenedor">
        <div class="forma1"></div>
        <div class="forma2"></div>
        <div class="forma3"></div>
        <div class="forma4"></div>
        <div class="forma5"></div>
        <div class="forma6"></div>
        <div class="cont">
            <div class="forma7"></div>
            <div class="forma8"></div>
            <div class="forma9"></div>
            <div class="forma10"></div>
        </div>
    </div>
</body>
</html>
