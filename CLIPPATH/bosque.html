<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMACION DEL BOSQUE</title>
    <style>

        .contenedor{
            background-image: url(img/fondo\ bosque.jpg);
            background-attachment: fixed;
            background-size: cover;
            width: 1200px;
            height: 1000px;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            z-index: -3;
            animation: fondo 6s forwards linear;
        }
        @keyframes fondo {
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.1);
            }
            100%{
                transform: scale(1);
            }
        }
        .nube1{
            background-image: url(img/nube.png);
            background-size: cover;
            width: 600px;
            height: 300px;
            position: absolute;
            bottom: -70px;
            left: -50px;
            z-index: -2;

            animation: nub1 3s infinite linear ;
        }
        @keyframes nub1 {
            0%{
                transform: scale(1);
                left: -50px;
            }
            33%{
                transform: scale(1.1);
                left: 0px;
            }
            66%{
                transform: scale(1.1);
                left: -30px;
            }
            100%{
                transform: scale(1);
                left: -50px;
            }
        }
        .nube2{
            background-image: url(img/nube.png);
            background-size: cover;
            width: 600px;
            height: 500px;
            position: absolute;
            bottom: -150px;
            right: -100px;
            z-index: -2;
            animation: nub2 4s infinite linear ;
        }
        @keyframes nub2 {
            0%{
                transform: scale(1);
                right: -50px;
            }
            33%{
                transform: scale(1.1);
                right: 0px;
            }
            66%{
                transform: scale(1.1);
                right: -30px;
            }
            100%{
                transform: scale(1);
                right: -50px;
            }
        }
        .arbol1{
            background-image: url(img/arb1.png);
            background-size: cover;
            width: 700px;
            height: 1300px;
            top: -100px;
            position: absolute;
            bottom: 0px;
            right: -200px;
            z-index: -1;
            animation: arb1 10s forwards linear ;
        }
        @keyframes arb1 {
            0%{
                right: -200px;
                transform: scale(1);
            }
            100%{
                right: -900px;
                transform: scale(1.1);
            }
        }
        .enreda{
            background-image: url(img/enredadera.png);
            background-size: cover;
            width: 1200px;
            height: 500px;
            top: -100px;
            position: absolute;
            left: -100px;
            z-index: -1;
            animation: enreda 15s forwards linear ;
        }
        @keyframes enreda {
            0%{
                left: -100px;
                top: -100px;
                transform: scale(1);
            }
            100%{
                left: -1250px;
                top: -200px;
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <a href="../index.html">VOLVER AL INICIO</a>
    <br><br><br>
    <br><br>
    <div class="contenedor">
        <div class="hojas"></div>
        <div class="arbol1"></div>
        <div class="enreda"></div>
        <div class="fondo"></div>
        <div class="nube1"></div>
        <div class="nube2"></div>
    </div>
</body>
</html>
